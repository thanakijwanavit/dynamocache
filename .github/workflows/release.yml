name: Release

# Publishes to PyPI using Trusted Publishing (OpenID Connect) — no long-lived
# API tokens stored in the repo. Configure a PyPI trusted publisher for this
# repository/workflow first: https://docs.pypi.org/trusted-publishers/
#
# Triggered by pushing a version tag, e.g. `git tag v0.1.0 && git push --tags`.

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
